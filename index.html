<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages Test</title>
  <style>
    :root { --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #59636e; --accent: #1f883d; --border: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #9198a1; --accent: #3fb950; --border: #30363d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text);
           font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .card { max-width: 520px; width: 100%; background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 32px; text-align: center; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent);
             color: #fff; font-size: 14px; font-weight: 600; }
    h1 { margin: 16px 0 8px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.5; }
    code { background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">✓ Yayında</span>
    <h1>GitHub Pages çalışıyor!</h1>
    <p>Bu sayfayı görüyorsanız GitHub Pages kurulumu başarılı.</p>
    <p>Sayfa yüklendi: <code id="time"></code></p>
  </main>
  <script>document.getElementById('time').textContent = new Date().toLocaleString('tr-TR');</script>
</body>
</html>
